<title>Red Pen</title>
<meta name="description" content="A grammar game for learners of English: put words in order, fill gaps, spot mistakes, fix sentences.">
<meta name="theme-color" content="#f3f7f7">
<script>/* apply the saved theme before the page paints (default: light) */try{var s=JSON.parse(localStorage.getItem("redpen.v1"));var t=s&&s.themeChosen?s.theme:"light";if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){document.documentElement.setAttribute("data-theme","light")}</script>

</head>

<div id="app" class="app" aria-live="polite">
